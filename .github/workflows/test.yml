name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Separate from the test step so a proxy.golang.org hiccup shows up as a
      # failed download, not as "[setup failed]" buried in test output.
      - name: Download modules
        run: |
          for i in 1 2 3; do go mod download && break || sleep $((i * 10)); done

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...
