name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Separate from the test step so a proxy.golang.org hiccup shows up as a
      # failed download, not as "[setup failed]" buried in test output.
      - name: Download modules
        run: |
          for i in 1 2 3; do go mod download && break || sleep $((i * 10)); done

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  # Builds every release artifact, images included, without publishing, so a
  # broken Dockerfile or GoReleaser config fails here rather than on a tag.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      - name: Smoke-test the image
        run: docker run --rm "$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -m1 'skope:.*-amd64')" version
