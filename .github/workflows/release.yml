name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # GitHub release, and moving the floating major tag
  packages: write   # ghcr.io/rubysolo/skope

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CI pins the report action to a major version (rubysolo/skope/report@v0),
      # so that tag follows the newest release.
      - name: Move the floating major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "${GITHUB_REF_NAME}^{commit}"
          git push -f origin "refs/tags/$major"
